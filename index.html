<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- D12: "Add to Home Screen" launches without browser UI (the only fullscreen an iPhone gets). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Visual Novel Starter</title>
  </head>
  <body>
    <main id="game-root" aria-label="Visual novel">
      <section id="pixi-host" aria-hidden="true"></section>

      <nav id="top-controls" aria-label="Story controls">
        <button id="back-button" class="control-button" type="button" disabled>← Back</button>
        <button id="menu-button" class="control-button" type="button">Menu</button>
      </nav>

      <section id="dialogue-panel" class="glass-panel" aria-live="polite">
        <div class="speaker-row">
          <h1 id="speaker-name">...</h1>
          <span id="save-status">Autosave ready</span>
        </div>
        <p id="dialogue-text">Loading story...</p>
        <p id="continue-hint">Click, tap, Space, or Enter to continue</p>
      </section>

      <section id="choice-panel" class="glass-panel hidden" aria-label="Choices"></section>

      <section id="end-card" class="glass-panel" role="dialog" aria-labelledby="end-title">
        <h2 id="end-title">KONEC</h2>
        <p id="end-kind" class="end-kind"></p>
        <p id="end-text"></p>
        <button id="end-home" class="choice-button" type="button">Zpět na začátek</button>
      </section>

      <section id="main-menu" aria-label="Hlavní menu">
        <div id="menu-main" class="menu-page">
          <h1>Dračí jezdkyně</h1>
          <button id="menu-start" class="choice-button" type="button">Pokračovat</button>
          <button id="menu-new" class="choice-button" type="button">Nová hra</button>
          <button class="choice-button" type="button" data-page="settings">Nastavení</button>
          <button class="choice-button" type="button" data-page="gallery">Galerie</button>
        </div>
        <div id="menu-confirm" class="menu-page glass-panel hidden">
          <h2>Nová hra</h2>
          <p>Začít novou hru? Rozehraná hra se ztratí.</p>
          <button class="choice-button" type="button" data-page="main">Ne</button>
          <button id="menu-confirm-yes" class="choice-button" type="button">Ano</button>
        </div>
        <div id="menu-settings" class="menu-page glass-panel hidden">
          <h2>Nastavení</h2>
          <label class="setting">
            Hlasitost hudby
            <input id="setting-music" type="range" min="0" max="100" step="5" />
          </label>
          <label class="setting">
            Automaticky pokračovat
            <input id="setting-autoread" type="checkbox" />
          </label>
          <button class="control-button" type="button" data-page="main">Zpět</button>
        </div>
        <div id="menu-gallery" class="menu-page glass-panel hidden">
          <h2>Galerie</h2>
          <ul id="gallery-list"></ul>
          <button class="control-button" type="button" data-page="main">Zpět</button>
        </div>
      </section>
    </main>

    <div id="rotate-hint">
      <p>Otoč telefon na šířku</p>
      <small>Když se obraz neotočí, vypni zámek otáčení.</small>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
